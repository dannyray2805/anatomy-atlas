<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anatomy Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the remembered theme before React mounts, so a light-theme visitor never gets a
      // dark flash. Key + accepted values must stay in sync with src/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem("anatomy-atlas.theme.v1");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (e) {
          /* storage unavailable — fall through to the default theme */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
