<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Anatomy Atlas">
  <!--
    The mark is the product's own gesture — layers opening onto a core — drawn as concentric arcs
    rather than as anatomy, so the icon cannot be read as a depiction of any body.
  -->
  <rect width="64" height="64" rx="14" fill="#0a0e16"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#e0a887" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="86 34" transform="rotate(-30 32 32)"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="#e8e2d0" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="42 27" transform="rotate(40 32 32)"/>
  <circle cx="32" cy="32" r="3.4" fill="#b03a2e"/>
</svg>
